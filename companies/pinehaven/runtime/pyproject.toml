[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinehaven-corporate-finance"
version = "1.0.0"
description = "A HUD-compatible multi-plant manufacturing corporate-finance company package"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp==3.0.2",
  "hud>=0.6.11,<0.7",
  "openai>=1.109,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<3",
  "numpy>=2.3,<3",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "reportlab>=4.4,<5",
  "pypdf>=6,<7",
  "pdfplumber>=0.11,<1",
  "pillow>=12,<13",
]

[tool.setuptools]
py-modules = ["env", "tasks", "task_catalog", "task_prompts", "task_templates"]

[tool.setuptools.packages.find]
include = ["pinehaven_company*", "evaluator*"]

[tool.setuptools.package-data]
evaluator = ["reference/*.json", "reference/*.txt"]
